# Adds a job to the CI service on every push. Copy to .github/workflows/ in the
# repo, with job.sh at the repo root.
#
# Needs, in the repo's Settings -> Secrets and variables -> Actions:
#   secret   BRICS_CI_ORIGIN_TOKEN  your origin token
#   variable BRICS_CI_URL           the job API's URL, e.g. the dev tunnel's
#
# The job ID is printed in the log. That's fine: releasing the job needs your
# origin token too (see submitter/README.md).
#
# The job is sent with GitHub's own OIDC token for this run, so the CI service knows
# which repo, commit and run it came from (backend/ci_backend/github_oidc.py). Nothing
# to set up for that: `id-token: write` below lets the job ask GitHub for one.
name: brics-ci

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # lets this job get GitHub's OIDC token, which says where the job came from

jobs:
  submit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Add the job to the CI service
        env:
          ORIGIN_TOKEN: ${{ secrets.BRICS_CI_ORIGIN_TOKEN }}
          CI_URL: ${{ vars.BRICS_CI_URL }}
        run: |
          # DEV: 
          #     Just say where the job came from (an FYI, if you will)
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          sed -e "s|@REPO@|$GITHUB_REPOSITORY|g" \
              -e "s|@SHA@|$GITHUB_SHA|g" \
              -e "s|@RUN_URL@|$run_url|g" \
              job.sh > job.submitted.sh

          # GitHub's token for this run, for the CI service's audience. Masked in the
          # log; it lasts minutes, and the CI service accepts it once
          github_token=$(curl -sS --fail-with-body \
            -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=isambard-ci" | jq -r .value)
          echo "::add-mask::$github_token"

          resp=$(curl -sS --fail-with-body -X POST "$CI_URL/jobs" \
            -H "Authorization: Bearer $github_token" \
            -H "Origin-Token: $ORIGIN_TOKEN" \
            -H "Content-Type: text/plain" \
            --data-binary @job.submitted.sh)
          echo "$resp" | jq .
          # The job's address goes in backticks, so GitHub doesn't make it a link.
          # Clicking a link on github.com wouldn't send the submitter's login
          # cookie, so you'd look logged out. Pasting the address does send it.
          {
            echo "### BriCS CI"
            echo "Job \`$(jq -r .id <<<"$resp")\` added for $GITHUB_SHA."
            echo
            echo "To release it, log in to the submitter, then copy this address into your browser and give your origin token:"
            echo
            echo "\`$(jq -r .release_url <<<"$resp")\`"
          } >> "$GITHUB_STEP_SUMMARY"
